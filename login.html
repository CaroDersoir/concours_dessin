<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Le Grand Gribouillis</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Le Grand Gribouillis</h1>

        <button id="loginBtn" class="btn login-btn">Se connecter</button>

        <nav>
            <!-- Menu public -->
            <div class="dropdown">
                <button class="dropdown-btn">Menu</button>
                <div class="dropdown-content">
                    <a href="accueil.html">Accueil</a>
                    <a href="apropos.html">À propos</a>
                    <a href="concours.html">Concours</a>
                </div>
            </div>

            <!-- Menu privé -->
            <div class="dropdown nav-private">
                <button class="dropdown-btn">Mon Rôle</button>
                <div class="dropdown-content">
                    <a href="#">Président</a>
                    <a href="/role/competiteur.html">Compétiteur</a>
                    <a href="/role/directeur.html">Directeur</a>
                    <a href="/role/evaluateur.html">Évaluateur</a>
                    <a href="/role/administrateur.html">Administrateur</a>
                </div>
            </div>

            <!-- Lien privé -->
            <a href="/utilisateur/monEspace.html" class="nav-private">Mon Espace</a>

            <!-- Lien public -->
            <a href="contact.html">Contact</a> 
        </nav>
    </header>

    <main class="login-container">
        <h2>Connexion</h2>
        <form id="loginForm">
            <label for="utilisateur">Nom d'utilisateur :</label>
            <input type="text" id="utilisateur" name="utilisateur" placeholder="PDupont" required>
            <br>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <br>
            <br>
            <button type="submit" class="btn">Se connecter</button>
            <button type="button" class="inscription">S'inscrire</button>

        </form>
    </main>

    <!-- Lien vers le JS externe -->
    <script src="service/login.js"></script>
    <script src="service/bpConnection.js"></script>
    <script src="service/nav_log.js"></script>

    <footer>
        <p>
            © 2026 Le Grand Gribouillis <br>
            Créé par DERSOIR Caroline / CHAUVEAU Rémi / GUILLET Bastien / LUCAS Elouan
        </p>
    </footer>
</body>
</html>
